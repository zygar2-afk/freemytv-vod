name: Probe VOD source (experimental)
on:
  push:
    branches:
      - feature/vod-source-probe
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'
permissions:
  contents: write
jobs:
  tmdb-series:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests using mocked TMDB responses
        run: python3 -m unittest discover -s scripts -p test_tmdb_series.py -v
      - name: Check TMDB credentials
        id: tmdb_auth
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [[ -n "$TMDB_READ_TOKEN" || -n "$TMDB_API_KEY" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'TMDB credentials available; live integration enabled'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'TMDB credentials not configured; only offline unit tests can run'
          fi
      - name: Discover real TMDB recent seasons
        if: steps.tmdb_auth.outputs.available == 'true'
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 scripts/build_tmdb_series.py
      - name: Upload verified-date series candidates
        if: steps.tmdb_auth.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tmdb-series-21-days
          path: out/tmdb_series_21d.json
          if-no-files-found: error
          retention-days: 7
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run source availability probe
        run: python3 scripts/probe_vod_source.py
      - name: Inspect date and link markup (diagnostic only)
        run: python3 scripts/inspect_vod_markup.py
      - name: Audit pagination and sorting (landing page only)
        run: python3 scripts/audit_vod_pagination.py
      - name: Inspect at most four listing pages for weekly coverage
        run: python3 scripts/probe_weekly_pagination.py
      - name: Inspect series listing (diagnostic only)
        run: python3 scripts/probe_series_source.py
      - name: Upload unrated series review queue (not for TCL)
        uses: actions/upload-artifact@v4
        with:
          name: experimental-series-needs-review
          path: out/experimental_series_needs_review.json
          if-no-files-found: error
          retention-days: 7
      - name: Generate unverified weekly candidates
        run: python3 scripts/build_experimental_candidates.py
      - name: Generate combined TOP 10 films and series (experimental)
        run: python3 scripts/build_top10_films_series.py
      - name: Upload TOP 10 candidates for evidence review
        uses: actions/upload-artifact@v4
        with:
          name: top10-candidates-needing-premiere-evidence
          path: out/experimental_vod_top10.json
          if-no-files-found: error
          retention-days: 7
      - name: Validate and publish separately labeled new-to-VOD serials
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from validate_weekly_premieres import validate
          import datetime as dt
          import zoneinfo
          source = json.loads(Path('out/experimental_vod_top10.json').read_text(encoding='utf-8'))
          separate = {k: source[k] for k in ('region', 'generatedAt', 'todayWarsaw')}
          separate['movies'] = []
          separate['series'] = source['series']
          separate['seriesLabel'] = 'Nowo dodane na VOD (21 dni); nowe sezony niepotwierdzone'
          separate['productionReady'] = False
          issues = validate(separate, dt.datetime.now(zoneinfo.ZoneInfo('Europe/Warsaw')).date())
          if issues or not separate['series']:
              raise SystemExit('Series check BLOCKED: ' + repr(issues[:6]))
          Path('out/experimental_series_new_on_vod.json').write_text(json.dumps(separate, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Series new-to-VOD candidates:', len(separate['series']))
          PY
      - name: Upload newly-added series sample
        uses: actions/upload-artifact@v4
        with:
          name: experimental-series-new-on-vod
          path: out/experimental_series_new_on_vod.json
          if-no-files-found: error
          retention-days: 7
      - name: Require nonempty film and series lists before publication
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('out/experimental_vod_top10.json').read_text(encoding='utf-8'))
          films, series = len(data.get('movies', [])), len(data.get('series', []))
          print(f'Publish gate: films={films}, series={series}')
          if films == 0 or series == 0:
              raise SystemExit('BLOCKED: refusing to publish empty film or series list')
          PY
      - name: Require evidenced premieres before publication
        run: python3 scripts/validate_weekly_premieres.py out/experimental_vod_top10.json
      - name: Publish experimental JSON on this branch
        run: |
          mkdir -p data
          cp out/experimental_vod_top10.json data/experimental_vod_top10.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/experimental_vod_top10.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh experimental TOP 10 VOD JSON [skip ci]'
            git push origin HEAD:feature/vod-source-probe
          fi
      - name: Upload combined TOP 10 JSON
        uses: actions/upload-artifact@v4
        with:
          name: experimental-top10-films-series
          path: out/experimental_vod_top10.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload non-production candidate JSON
        uses: actions/upload-artifact@v4
        with:
          name: experimental-vod-candidates
          path: out/experimental_vod_candidates.json
          if-no-files-found: error
          retention-days: 7
